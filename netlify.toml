# The food & exercise diary is a static PWA living in diary/.
# Netlify builds from that folder and serves dist/ as the site root.

[build]
  base = "diary"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path falls through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served stale, or updates never land.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
