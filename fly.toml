# Fly.io deployment.
#
#   fly launch --no-deploy --copy-config --name <your-unique-name>
#   fly volumes create family_data --size 1 --region lhr
#   fly deploy
#
# `app` must be unique across the whole of Fly, so change it to something like
# "tucknott-family-calendar" before deploying.

app = "family-organiser"
primary_region = "lhr"          # London — closest region to the UK

[build]

[env]
  PORT = "3000"
  # Must match the mount destination below.
  DATABASE_PATH = "/data/family-organiser.db"

# The calendar is a SQLite file, so it needs a real disk that survives deploys.
[mounts]
  source = "family_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true            # session cookies are `secure` in production
  # A family calendar is idle almost all of the time, and you are billed for
  # the time a machine is awake — so it sleeps when nobody is looking at it.
  # "suspend" freezes memory rather than shutting down, so waking is quick.
  # Set auto_stop_machines = "off" and min_machines_running = 1 if you would
  # rather pay a few pounds a month to never wait at all.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # One machine, always. SQLite has a single writer, and a second machine would
  # get its own separate volume — two half-calendars instead of one shared one.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
